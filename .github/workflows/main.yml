name: CI/CD - Weather Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        run: |
          IMAGE=ghcr.io/katsudon27/swe40006_groupproject_sourcecode/weather-dashboard:latest
          docker build -t $IMAGE .
          docker push $IMAGE

  test:                                # << top-level job (aligned with build/deploy)
    runs-on: ubuntu-latest
    needs: build
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start app (background, with logs)
        run: |
          export OPENWEATHER_API_KEY="${{ env.OPENWEATHER_API_KEY }}"
          nohup python app.py > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid
          sleep 2
          (command -v ss >/dev/null && ss -ltnp || true) || true

      - name: Smoke checks (retry)
        run: |
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              echo "Health OK"; exit 0
            fi
            echo "Waiting for app (try $i/15) ..."
            sleep 2
          done
          echo "---- /tmp/app.log ----"
          cat /tmp/app.log || true
          echo "App failed to start"
          exit 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: SSH deploy
    # v1.0.0 or latest stable
        uses: appleboy/ssh-action@v1.0.0
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}     # e.g., 52.207.61.168
          username: ${{ secrets.EC2_USER }} # 'ubuntu' for Ubuntu AMI
          key: ${{ secrets.EC2_SSH_KEY }}   # paste PEM contents as secret
          envs: PROD_API_KEY,GITHUB_TOKEN,${{ github.actor }}
          script: |
            export PROD_API_KEY="$PROD_API_KEY"
            export GITHUB_TOKEN="$GITHUB_TOKEN"
            export GITHUB_ACTOR="${{ github.actor }}"
            bash ~/deploy.sh
    


    


