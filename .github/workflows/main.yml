on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

              
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'

              
      - name: Install dependencies
        run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

      - name: Verify application build
        run: |
                echo "Running Flask build check..."
                python -m flask --version

              # ---------- OPTION 1: Build & Push Docker image to GitHub Container Registry ----------
              
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

              
      - name: Build and push Docker image (GitHub Container Registry)
        run: |
                IMAGE_NAME=ghcr.io/${{ github.repository }}/weather-dashboard:latest
                docker build --build-arg OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }} -t $IMAGE_NAME .
                docker push $IMAGE_NAME

   