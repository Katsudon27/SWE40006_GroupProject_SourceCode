name: CI/CD - Weather Dashboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        run: |
          IMAGE=ghcr.io/katsudon27/swe40006_groupproject_sourcecode/weather-dashboard:latest
          docker build -t $IMAGE .
          docker push $IMAGE

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short --no-cov

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short --no-cov

      - name: Run Real API Integration Test
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          export OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}"
          python -c "
          from app import get_weather, get_forecast
          import sys

          print('Testing real API call to get_weather()...')
          weather = get_weather('Melbourne')
          if weather is None:
              print('ERROR: get_weather() returned None')
              sys.exit(1)
          if 'temp' not in weather or 'name' not in weather:
              print('ERROR: Invalid weather data structure')
              sys.exit(1)
          print(f'✓ Successfully fetched weather for {weather[\"name\"]}: {weather[\"temp\"]}°C')

          print('Testing real API call to get_forecast()...')
          forecast = get_forecast('Melbourne')
          if forecast is None:
              print('ERROR: get_forecast() returned None')
              sys.exit(1)
          if len(forecast) < 1:
              print('ERROR: Forecast data is empty')
              sys.exit(1)
          print(f'✓ Successfully fetched {len(forecast)}-day forecast')

          print('✓ Real API integration tests passed!')
          "

      - name: Generate Coverage Report
        run: |
          pytest tests/ --cov=app --cov-report=html --cov-report=xml --cov-report=term | tee coverage-summary.txt

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            coverage-summary.txt
          retention-days: 90

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: |
            pytest-logs/
          retention-days: 90

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(grep "TOTAL" coverage-summary.txt | awk '{print $NF}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 75" | bc -l) )); then
            echo "ERROR: Coverage $COVERAGE% is below 75% threshold"
            exit 1
          fi
          echo "SUCCESS: Coverage $COVERAGE% meets 75% threshold"

      - name: Smoke Test - Start App
        run: |
          nohup python app.py > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid
          sleep 3

      - name: Smoke Test - Health Check
        run: |
          for i in {1..10}; do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for app (attempt $i/10)..."
            sleep 2
          done
          echo "Health check failed"
          cat /tmp/app.log || true
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.0
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PROD_API_KEY,GITHUB_TOKEN,${{ github.actor }}
          script: |
            export PROD_API_KEY="$PROD_API_KEY"
            export GITHUB_TOKEN="$GITHUB_TOKEN"
            export GITHUB_ACTOR="${{ github.actor }}"
            bash ~/deploy.sh

