name: CI/CD - Weather Dashboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          IMAGE=ghcr.io/katsudon27/swe40006_groupproject_sourcecode/weather-dashboard
          TAG=${{ github.sha }}
          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  test:
    name: Run Testing ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short --no-cov

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short --no-cov

      - name: Run Real API Integration Test
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          export OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}"
          python - <<'PYCODE'
          import sys
          from app import get_weather, get_forecast

          try:
              print('Testing real API call to get_weather()...')
              weather = get_weather('Melbourne')
              if not weather or 'temp' not in weather or 'name' not in weather:
                  raise ValueError('Invalid weather data structure')
              print(f'Weather for {weather["name"]}: {weather["temp"]}°C')

              print('Testing real API call to get_forecast()...')
              forecast = get_forecast('Melbourne')
              if not forecast or len(forecast) < 1:
                  raise ValueError('Forecast data is empty')
              print(f'Successfully fetched {len(forecast)}-day forecast')

              print('Real API integration tests passed!')
          except Exception as e:
              print(f'API integration test failed: {e}')
              sys.exit(1)
          PYCODE

      - name: Generate Coverage Report
        run: |
          pytest tests/ --cov=app --cov-report=html --cov-report=xml --cov-report=term | tee coverage-summary.txt

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            coverage-summary.txt
          retention-days: 90

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: pytest-logs/
          retention-days: 90

      - name: Check Coverage Threshold (≥75%)
        run: |
          COVERAGE=$(grep "TOTAL" coverage-summary.txt | awk '{print $NF}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 75" | bc -l) )); then
            echo "ERROR: Coverage $COVERAGE% is below 75% threshold"
            exit 1
          fi
          echo "SUCCESS: Coverage $COVERAGE% meets 75% threshold"

      - name: Smoke Test - Start App
        run: |
          nohup python app.py > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid
          sleep 3

      - name: Smoke Test - Health Check
        run: |
          for i in {1..10}; do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for app (attempt $i/10)..."
            sleep 2
          done
          echo "Health check failed"
          cat /tmp/app.log || true
          exit 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PROD_API_KEY,GITHUB_TOKEN,${{ github.actor }}
          script: |
            export PROD_API_KEY="$PROD_API_KEY"
            export GITHUB_TOKEN="$GITHUB_TOKEN"
            export GITHUB_ACTOR="${{ github.actor }}"
            echo "Deploying latest Docker image to EC2..."
            bash ~/deploy.sh
            echo "Running post-deploy health check..."
            if ! curl -f http://localhost:5000/health; then
              echo "Post-deploy health check failed!"
              exit 1
            fi
            echo "Deployment successful and app is healthy!"
